[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-records-collection"
version = "0.0.0"
description = "Utilities for ingesting and visualizing consolidated health record data."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Lauren Parlett" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "black",
  "pylint",
  "bandit",
  "mypy",
  "coverage[toml]"
]

[tool.setuptools.packages.find]
include = ["health_records_collection*"]

[tool.pylint]
exclude = ["health_records_collection/AI_tests_reports"]

[tool.pylint.MASTER]
ignore = [".venv", "build", "dist", "data", "docs/_build", "AI_tests_reports"]
extension-pkg-allow-list = ["lxml", "defusedxml"]
extension-pkg-whitelist = ["lxml", "defusedxml"]
load-plugins = ["pylint.extensions.docparams", "pylint.extensions.mccabe"]
jobs = 0
persistent = true

[tool.pylint."MESSAGES CONTROL"]
enable = ["useless-suppression"]
disable = [
    "C0111",
    "C0103",
    "C0303",
    "W0511",
    "W0105",
    "R0903",
    "R0801",
]

[tool.pylint.REPORTS]
reports = false
score = true

[tool.pylint.BASIC]
good-names = ["id", "ns", "db", "pk", "dt", "fn"]
docstring-min-length = 10
allow-any-import-level = false
bad-names = ["foo", "bar", "baz", "todo", "fixme", "data", "temp"]

[tool.pylint.FORMAT]
max-line-length = 88
max-module-lines = 1200
indent-string = "    "

[tool.pylint.LOGGING]
logging-format-style = "old"
logging-modules = ["logging"]

[tool.pylint.TYPECHECK]
ignored-modules = ["settings", "db.schema", "security.encryption"]
ignored-classes = ["etree._Element", "etree._ElementTree"]

[tool.pylint.DESIGN]
max-args = 10
max-attributes = 12
max-locals = 25
max-branches = 15
max-statements = 100
max-returns = 10

[tool.pylint.SIMILARITIES]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true

[tool.pylint.MISCELLANEOUS]
notes = ["FIXME", "XXX", "TODO", "SECURITY"]
